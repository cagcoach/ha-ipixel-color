name: Release

# Publishes a GitHub release when the manifest version on main has no tag yet.
# Bumping "version" in manifest.json (with a matching CHANGELOG.md section) is
# what ships a release. HACS offers users the published releases.
on:
  push:
    branches: [main]
    paths:
      - custom_components/ipixel_color/manifest.json
  workflow_dispatch:

permissions:
  contents: write

# No shared concurrency group: GitHub keeps only one pending run per group, so
# a queued version could be skipped. Each run releases its own commit's version.
jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    # A manual run can pick any branch; only main ever releases.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version=$(jq -er .version custom_components/ipixel_color/manifest.json)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # This version's "## [x.y.z]" section of CHANGELOG.md.
          python3 - <<'PY' > notes.md
          import os
          heading = f"## [{os.environ['VERSION']}]"
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          entry, inside = [], False
          for line in lines:
              if line.startswith("## "):
                  if inside:
                      break
                  inside = line.startswith(heading)
                  continue
              if inside:
                  entry.append(line)
          repo = os.environ["GITHUB_REPOSITORY"]
          text = "\n".join(entry).strip()
          print(text or f"See the [Changelog](https://github.com/{repo}/blob/main/CHANGELOG.md).")
          PY
          cat notes.md

      - name: Release if new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released; nothing to do."
            exit 0
          fi
          flags=()
          # A version with letters in it (0.3.0b1, 1.0.0rc1) is a pre-release.
          [[ "$VERSION" =~ [a-zA-Z] ]] && flags+=(--prerelease)
          if ! gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
              --notes-file notes.md "${flags[@]}"; then
            # Another run for the same version may have just released it.
            gh release view "$TAG" >/dev/null 2>&1 || exit 1
            echo "$TAG was released by another run."
          fi
